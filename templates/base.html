<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Complaint Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
            background-color: #f5f7fa;
            color: #222;
        }

        header, main {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        header h1 {
            margin-top: 0;
        }

        a {
            color: #1457a6;
        }

        input, button {
            padding: 10px;
            margin: 6px 0 12px;
            max-width: 100%;
        }

        input {
            box-sizing: border-box;
        }

        .message {
            padding: 10px;
            margin-bottom: 10px;
            background: #fff3cd;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }
    </style>
</head>
<body>
    <header>
        <h1>Smart Complaint Management System</h1>
        <p>Register, log in, and manage your complaints.</p>
    </header>

    <main>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p class="message">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
